                    ar: { name: 'استوديو مارينا - دور تالت', location: 'دور تالت، مارينا', beds: 'سرير كبير', baths: '2 حمام', highlight: 'دور عالي' },
                    en: { name: 'Marina Studio - Third Floor', location: 'Third Floor, Marina', beds: 'King Bed', baths: '2 Baths', highlight: 'High Floor' }
                },
                {
                    id: 10,
                    sector: 'marassi',
                    img: 'https://i.ibb.co/39TqTBzc/photo-9-2026-05-05-15-45-02.jpg',
                    ar: { name: 'غرفتين مارينا - قرب البول', location: 'خطوات من البول والممشى', beds: 'سرير كبير + 2 سرير صغير', baths: '2 حمام', highlight: 'قرب الممشى' },
                    en: { name: 'Two-Bedroom Marina - Near Pool', location: 'Steps to Pool & Marina Walk', beds: 'King Bed + 2 Twin Beds', baths: '2 Baths', highlight: 'Near Marina Walk' }
                },
                {
                    id: 11,
                    sector: 'hacienda',
                    img: 'https://i.ibb.co/kg5j4TWr/photo-2-2026-05-05-15-49-01.jpg',
                    ar: { name: 'فيلا ستاندالون هاسيندا', location: 'برايفت بول', beds: '5 غرف نوم', baths: 'عدة حمامات', highlight: 'برايفت بول' },
                    en: { name: 'Standalone Villa Hacienda', location: 'Private Pool', beds: '5 Bedrooms', baths: 'Multiple Baths', highlight: 'Private Pool' }
                },
                {
                    id: 12,
                    sector: 'hacienda',
                    img: 'https://i.ibb.co/nM8Njj2k/photo-3-2026-05-05-15-56-46.jpg',
                    ar: { name: 'شقة ٣ غرف مارينا مراسي', location: 'فيو لاجون دايركت', beds: '3 سرير كبير', baths: '3 حمامات', highlight: 'إطلالة لاجون' },
                    en: { name: '3-Bedroom Lagoon Villa', location: 'Direct Lagoon View', beds: '3 King Beds', baths: '3 Baths', highlight: 'Lagoon View' }
                },
                {
                    id: 13,
                    sector: 'marassi',
                    img: 'https://i.ibb.co/Pz9Y0J9q/photo-2-2026-05-05-16-11-28.jpg',
                    ar: { name: 'استوديو مارينا - فيو المارينا', location: 'فيو المارينا', beds: '2 سرير كبير + أريكة سرير', baths: '1 حمام', highlight: 'إطلالة المارينا' },
                    en: { name: 'Marina Studio - Marina View', location: 'Marina View', beds: '2 King Beds + Sofa Bed', baths: '1 Bath', highlight: 'Marina View' }
                },
                {
                    id: 14,
                    sector: 'hacienda',
                    img: 'https://i.ibb.co/tp7h7pk7/photo-8-2026-05-05-16-17-27.jpg',
                    ar: { name: 'تاون هاوس هاسيندا', location: 'جاردن كبيرة', beds: '4 غرف نوم', baths: '3 حمام', highlight: 'جاردن واسعة' },
                    en: { name: 'Townhouse Hacienda Bay', location: 'Large Garden', beds: '4 Bedrooms', baths: '3 Baths', highlight: 'Spacious Garden' }
                }
            ];

            let currentLang = 'ar';
            const htmlEl = document.documentElement;
            const scrollContainer = document.getElementById('allChaletsScroll');
            const progressBar = document.getElementById('progressBar');

            function detectLanguage() {
                const browserLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
                return browserLang.startsWith('ar') ? 'ar' : 'en';
            }

            function setLanguage(lang) {
                currentLang = lang;
                htmlEl.lang = lang;
                htmlEl.dir = lang === 'ar' ? 'rtl' : 'ltr';

                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    if (translations[lang] && translations[lang][key]) {
                        el.innerHTML = translations[lang][key];
                    }
                });

                document.title = translations[lang].page_title;
                document.querySelector('meta[name="description"]').setAttribute('content', translations[lang].meta_desc);

                const toggleBtn = document.getElementById('langToggle');
                if (toggleBtn) {
                    toggleBtn.querySelector('span').textContent = translations[lang].lang_toggle;
                }

                renderCards();
                buildProgress();
                updateProgress();

                localStorage.setItem('royal-stay-lang', lang);
            }

            function renderCards() {
                if (!scrollContainer) return;
                let html = '';
                const t = translations[currentLang];
                const sectors = ['marassi', 'hacienda'];
                const ordered = sectors.reduce((acc, sector) => acc.concat(chaletsData.filter(c => c.sector === sector)), []);
                ordered.forEach(c => {
                    const data = c[currentLang];
                    const sectorName = c.sector === 'marassi' ? t.sector_marassi : t.sector_hacienda;
                    html += `
                    <a href="unit${c.id}.html" target="_blank" class="chalet-card" data-sector="${c.sector}">
                        <div class="chalet-media">
                            <img src="${c.img}" alt="${data.name}" loading="lazy">
                            <span class="sector-badge">${sectorName}</span>
                        </div>
                        <div class="chalet-body">
                            <h3>${data.name}</h3>
                            <div class="location"><i class="fas fa-location-dot"></i> ${data.location}</div>
                            <div class="chips">
                                <span class="chip"><i class="fas fa-bed"></i> ${data.beds}</span>
                                <span class="chip"><i class="fas fa-bath"></i> ${data.baths}</span>
                                <span class="chip"><i class="fas fa-eye"></i> ${data.highlight}</span>
                            </div>
                            <div class="card-footer">
                                <span class="mini-action"><i class="fas fa-arrow-left"></i> ${t.chalet_details}</span>
                                <span class="btn-book" onclick="event.preventDefault(); event.stopPropagation(); window.location.href='index.html#contact';">${t.chalet_book}</span>
                            </div>
                        </div>
                    </a>`;
                });
                scrollContainer.innerHTML = html;
            }

            function buildProgress() {
                if (!progressBar) return;
                progressBar.innerHTML = '';
                const totalCards = chaletsData.length;
                for (let i = 0; i < totalCards; i++) {
                    const seg = document.createElement('div');
                    seg.className = 'progress-segment';
                    seg.addEventListener('click', () => {
                        const cards = document.querySelectorAll('.chalet-card');
                        if (!cards.length) return;
                        const maxScroll = scrollContainer.scrollWidth - scrollContainer.clientWidth;
                        if (maxScroll <= 0) return;
                        const target = (i / (totalCards - 1)) * maxScroll;
                        scrollContainer.scrollTo({ left: target, behavior: 'smooth' });
                    });
                    progressBar.appendChild(seg);
                }
            }

            function updateProgress() {
                const cards = document.querySelectorAll('.chalet-card');
                if (!cards.length) return;
                const totalCards = cards.length;
                const maxScroll = scrollContainer.scrollWidth - scrollContainer.clientWidth;
                let activeIndex = 0;
                if (maxScroll > 0) {
                    const progress = Math.abs(scrollContainer.scrollLeft) / maxScroll;
                    activeIndex = Math.min(totalCards - 1, Math.round(progress * (totalCards - 1)));
                }
                document.querySelectorAll('.progress-segment').forEach((seg, idx) => {
                    seg.classList.toggle('active', idx === activeIndex);
                });
            }

            window.scrollToSector = function(sector, btn) {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active-marassi', 'active-hacienda'));
                btn.classList.add(`active-${sector}`);
                const firstCard = scrollContainer.querySelector(`.chalet-card[data-sector="${sector}"]`);
                if (firstCard) {
                    const maxScroll = scrollContainer.scrollWidth - scrollContainer.clientWidth;
                    if (maxScroll <= 0) return;
                    const cardOffset = firstCard.offsetLeft;
                    const containerWidth = scrollContainer.scrollWidth;
                    const target = (cardOffset / containerWidth) * maxScroll;
                    scrollContainer.scrollTo({ left: target, behavior: 'smooth' });
                }
            };

            document.addEventListener('DOMContentLoaded', () => {
                const savedLang = localStorage.getItem('royal-stay-lang');
                const lang = savedLang || detectLanguage();
                setLanguage(lang);

                document.getElementById('langToggle').addEventListener('click', () => {
                    const newLang = currentLang === 'ar' ? 'en' : 'ar';
                    setLanguage(newLang);
                });

                AOS.init({ duration: 800, once: true, offset: 50 });

                if (scrollContainer) {
                    scrollContainer.addEventListener('scroll', updateProgress);
                    window.addEventListener('resize', updateProgress);
                    setTimeout(updateProgress, 200);
                }

                document.getElementById('menuBtn').addEventListener('click', () => {
                    document.getElementById('navLinks').classList.toggle('open');
                });
                document.querySelectorAll('.nav-links a').forEach(a => {
                    a.addEventListener('click', () => document.getElementById('navLinks').classList.remove('open'));
                });
            });
        })();
    </script>
</body>
