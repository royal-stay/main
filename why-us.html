<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title data-i18n="page_title">لماذا Royal Stay | مزايا الإقامة الفاخرة</title>
    <meta name="description" data-i18n="meta_desc" content="اكتشف لماذا Royal Stay هي الاختيار الأذكى لإقامتك في مراسي وهاسيندا باي.">
    <meta name="theme-color" content="#0A0F1E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Playfair+Display:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --deep: #060B14; --text: #F8FAFC; --muted: #94A3B8;
            --gold: #C9A050; --gold-light: #E0BC6B;
            --gold-soft: rgba(201, 160, 80, 0.15);
            --transition: 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior:smooth; }
        body {
            font-family: 'Cairo', sans-serif; background: var(--deep);
            color: var(--text); overflow-x: hidden; line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }
        a { color:inherit; text-decoration:none; }
        img { display:block; max-width:100%; }
        .container { width: min(1280px, 92%); margin-inline: auto; }

        /* NAVBAR */
        .navbar {
            position: fixed; top:0; left:0; right:0; z-index:1000;
            padding: 0.7rem 0; transition: all var(--transition);
            background: rgba(6,11,20,0.85); backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .nav-inner {
            display: flex; justify-content: space-between;
            align-items: center; gap: 15px;
        }
        .brand {
            display: flex; flex-direction: row; align-items: center;
            gap: 10px; text-align: start; min-width: max-content;
        }
        .brand img {
            width: 40px; height: 40px; border-radius: 14px; background: #fff;
            border: 2px solid var(--gold); box-shadow: 0 8px 20px rgba(201,160,80,0.2);
            flex-shrink: 0;
        }
        .brand .name { display: flex; flex-direction: column; line-height: 1.2; }
        .brand .name strong {
            font-family: 'Playfair Display', serif; font-size: 1rem; color: #fff;
        }
        .brand .name span { font-size: 0.6rem; color: var(--muted); }

        .nav-links { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
        .nav-links a {
            padding:0.5rem 0.9rem; border-radius:100px; font-weight:700;
            font-size:0.8rem; transition:all var(--transition); color:#E2E8F0;
        }
        .nav-links a:hover, .nav-links a.active {
            background:rgba(255,255,255,0.08); color:#fff;
        }
        .nav-cta {
            background: linear-gradient(135deg, #B28A30, #D4A843);
            color: #fff !important; text-shadow: 0 1px 2px rgba(0,0,0,0.3);
            box-shadow: 0 8px 20px -5px rgba(201,160,80,0.6); font-weight: 800;
        }
        .nav-cta:hover { background: linear-gradient(135deg, #D4A843, #E0BC6B); }

        .nav-actions { display: flex; align-items: center; gap: 8px; }
        .lang-btn {
            padding:0.5rem 0.9rem; border-radius:100px; font-weight:700;
            font-size:0.8rem; transition:all var(--transition); cursor:pointer;
            background: rgba(201,160,80,0.08); border: 1px solid var(--gold);
            color: var(--gold-light); font-family: inherit;
            display: inline-flex; align-items: center; gap: 0.3rem;
        }
        .lang-btn:hover { background: var(--gold); color: #0A0F1E; border-color: var(--gold); }
        .menu-btn {
            display: none; width:38px; height:38px; border-radius:12px;
            background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);
            color:#fff; font-size:1.2rem; cursor:pointer;
        }

        /* PAGE CONTENT */
        .page-header { padding: 7rem 0 2rem; text-align: center; }
        .page-header .eyebrow {
            display:inline-flex; align-items:center; gap:0.6rem;
            background: var(--gold-soft); border:1px solid rgba(201,160,80,0.25);
            padding:0.4rem 1.4rem; border-radius:100px;
            font-size:0.75rem; font-weight:800; letter-spacing:0.1em;
            text-transform:uppercase; color:var(--gold-light); margin-bottom:1.2rem;
        }
        .page-header h1 {
            font-family:'Playfair Display',serif;
            font-size: clamp(2.2rem, 5vw, 3.5rem); font-weight:800;
        }
        .page-header h1 .gold { color:var(--gold-light); }
        .why-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem; padding: 2rem 0 5rem;
        }
        .feature-card {
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06);
            border-radius: 2rem; padding: 2rem 1.8rem; backdrop-filter: blur(10px);
            transition: all var(--transition); position: relative; overflow: hidden;
        }
        .feature-card::before {
            content:''; position:absolute; top:0; left:0; right:0;
            height:3px; background:linear-gradient(to right, var(--gold), var(--gold-light));
            transform: scaleX(0); transition: transform var(--transition);
        }
        .feature-card:hover { transform:translateY(-10px); background:rgba(255,255,255,0.05); }
        .feature-card:hover::before { transform: scaleX(1); }
        .feature-icon {
            width:56px; height:56px; border-radius:20px;
            background:linear-gradient(135deg, #1E293B, #0F172A);
            display:grid; place-items:center; font-size:1.4rem;
            color:var(--gold-light); margin-bottom:1.4rem;
        }
        .feature-card h3 { font-size:1.2rem; margin-bottom:0.7rem; font-weight:800; }
        .feature-card p { color:var(--muted); font-size:0.9rem; line-height:1.7; }

        /* شريط التواصل الأفقي في الأسفل */
        .social-bottom {
            padding: 2rem 0;
            background: rgba(255,255,255,0.02);
            border-top: 1px solid rgba(255,255,255,0.05);
            text-align: center;
        }
        .social-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            justify-content: center;
            align-items: center;
        }
        .social-icon-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(201,160,80,0.3);
            color: var(--gold-light);
            font-size: 1.4rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
        }
        .social-icon-circle:hover {
            background: var(--gold);
            color: #0A0F1E;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(201,160,80,0.3);
        }

        footer { padding:3rem 0; border-top:1px solid rgba(255,255,255,0.06); text-align:center; color:var(--muted); }

        @media (max-width: 1024px) {
            .why-grid { grid-template-columns: repeat(2,1fr); }
        }
        @media (max-width: 768px) {
            .menu-btn { display: flex; place-items: center; }
            .nav-links {
                position: fixed; top: 65px; left: 1rem; right: 1rem;
                background: rgba(6,11,20,0.95); backdrop-filter: blur(20px);
                border-radius: 2rem; padding: 1.5rem; flex-direction: column;
                display: none; box-shadow: 0 30px 50px rgba(0,0,0,0.5);
                order: 3;
            }
            .nav-links.open { display: flex; }
            .brand { order: 0; }
            .nav-actions { order: 1; }
            .why-grid { grid-template-columns:1fr; }
            .social-bottom { padding: 1.5rem 0; }
            .social-icon-circle { width: 44px; height: 44px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="container nav-inner">
            <a class="brand" href="https://royal-stay.github.io/main/index.html">
                <img src="https://i.ibb.co/dsttQM65/logo.png" alt="Royal Stay Logo">
                <div class="name">
                    <strong>Royal Stay</strong>
                    <span data-i18n="brand_tagline">شاليهات فاخرة • مراسي</span>
                </div>
            </a>
            <div class="nav-links" id="navLinks">
                <a href="https://royal-stay.github.io/main/index.html" data-i18n="nav_home">الرئيسية</a>
                <a href="https://royal-stay.github.io/main/why-us.html" class="active" data-i18n="nav_why">لماذا نحن</a>
                <a href="https://royal-stay.github.io/main/chalets.html" data-i18n="nav_chalets">الشاليهات</a>
                <a href="https://royal-stay.github.io/main/contact-us.html" class="nav-cta" data-i18n="nav_contact">تواصل معنا</a>
            </div>
            <div class="nav-actions">
                <button id="langToggle" class="lang-btn"><i class="fas fa-globe"></i> <span>English</span></button>
                <button class="menu-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
            </div>
        </div>
    </nav>

    <section class="page-header">
        <div class="container">
            <span class="eyebrow"><i class="fas fa-gem"></i> <span data-i18n="page_eyebrow">لماذا Royal Stay</span></span>
            <h1 data-i18n="page_title_h1">اختيارك <span class="gold">الأذكى</span> للإقامة الفاخرة</h1>
        </div>
    </section>

    <div class="container">
        <div class="why-grid" id="whyGrid"></div>
    </div>

    <!-- شريط التواصل الاجتماعي الأفقي -->
    <div class="social-bottom">
        <div class="container">
            <div class="social-row">
                <a href="https://www.instagram.com/royal_stay9" target="_blank" class="social-icon-circle"><i class="fab fa-instagram"></i></a>
                <a href="https://www.tiktok.com/@royalstay9" target="_blank" class="social-icon-circle"><i class="fab fa-tiktok"></i></a>
                <a href="https://www.facebook.com/profile.php?id=61589158047313" target="_blank" class="social-icon-circle"><i class="fab fa-facebook-f"></i></a>
                <a href="https://www.snapchat.com/add/royalstay9" target="_blank" class="social-icon-circle"><i class="fab fa-snapchat-ghost"></i></a>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p data-i18n="footer_text">© 2025 <span style="color:var(--gold-light);">Royal Stay</span> - جميع الحقوق محفوظة</p>
        </div>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        (function() {
            const translations = {
                ar: {
                    page_title: "لماذا Royal Stay | مزايا الإقامة الفاخرة",
                    meta_desc: "اكتشف لماذا Royal Stay هي الاختيار الأذكى لإقامتك في مراسي وهاسيندا باي.",
                    brand_tagline: "شاليهات فاخرة • مراسي",
                    nav_home: "الرئيسية", nav_why: "لماذا نحن", nav_chalets: "الشاليهات", nav_contact: "تواصل معنا",
                    page_eyebrow: "لماذا Royal Stay",
                    page_title_h1: 'اختيارك <span class="gold">الأذكى</span> للإقامة الفاخرة',
                    footer_text: '© 2025 <span style="color:var(--gold-light);">Royal Stay</span> - جميع الحقوق محفوظة',
                    lang_toggle: "English"
                },
                en: {
                    page_title: "Why Royal Stay | Luxury Stay Benefits",
                    meta_desc: "Discover why Royal Stay is the smartest choice for your stay in Marassi and Hacienda Bay.",
                    brand_tagline: "Luxury Chalets • Marassi",
                    nav_home: "Home", nav_why: "Why Us", nav_chalets: "Chalets", nav_contact: "Contact",
                    page_eyebrow: "Why Royal Stay",
                    page_title_h1: 'Your <span class="gold">Smartest</span> Choice for Luxury Stays',
                    footer_text: '© 2025 <span style="color:var(--gold-light);">Royal Stay</span> - All Rights Reserved',
                    lang_toggle: "عربي"
                }
            };

            const featuresData = [
                { icon: "fa-crown", key: "feat1" }, { icon: "fa-concierge-bell", key: "feat2" },
                { icon: "fa-tags", key: "feat3" }, { icon: "fa-headset", key: "feat4" },
                { icon: "fa-glass-cheers", key: "feat5" }, { icon: "fa-car", key: "feat6" },
                { icon: "fa-golf-ball-tee", key: "feat7" }
            ];

            const featureTexts = {
                ar: {
                    feat1: { title: "فخامة حقيقية", desc: "هوية بصرية راقية وتصميم هادئ يعكس مستوى الخدمة دون تعقيد." },
                    feat2: { title: "تيم هاوس كيبينج 24/7", desc: "فريق متخصص للعناية بنظافة وراحة الشاليه على مدار الساعة." },
                    feat3: { title: "خصومات الحجوزات الطويلة", desc: "خصومات حصرية على الإقامات الممتدة وحجوزات السيزون الكامل." },
                    feat4: { title: "تيم مساعدة ومتابعة 24/7", desc: "فريق دعم متواجد دائمًا للرد على استفساراتك وحل أي طارئ." },
                    feat5: { title: "تنظيم الرحلات كاملة", desc: "نرتب لك السهرات، الأنشطة، الخروجات وكل تفاصيل رحلتك، مش مجرد حجز." },
                    feat6: { title: "توفير عربية بسواق", desc: "نوفر لك سيارة خاصة مع سائق محترف لتنقلاتك أثناء الإقامة." },
                    feat7: { title: "جولف كارز للحجز", desc: "عربات جولف متاحة للتنقل داخل المنتجع بكل راحة وخصوصية." }
                },
                en: {
                    feat1: { title: "True Luxury", desc: "An elegant visual identity and calm design that reflects the level of service without complexity." },
                    feat2: { title: "24/7 Housekeeping", desc: "A specialized team for chalet cleanliness and comfort around the clock." },
                    feat3: { title: "Long Stay Discounts", desc: "Exclusive discounts for extended stays and full-season bookings." },
                    feat4: { title: "24/7 Support Team", desc: "A support team always available to answer your inquiries and resolve any emergencies." },
                    feat5: { title: "Full Trip Organization", desc: "We arrange your evenings, activities, outings and all trip details, not just booking." },
                    feat6: { title: "Private Car with Driver", desc: "We provide you with a private car and professional driver for your transportation during the stay." },
                    feat7: { title: "Golf Carts for Rent", desc: "Golf carts available for comfortable and private transportation within the resort." }
                }
            };

            let currentLang = 'ar';
            const htmlEl = document.documentElement;

            function detectLanguage() {
                const browserLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
                return browserLang.startsWith('ar') ? 'ar' : 'en';
            }

            function setLanguage(lang) {
                currentLang = lang;
                htmlEl.lang = lang;
                htmlEl.dir = lang === 'ar' ? 'rtl' : 'ltr';
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    if (translations[lang] && translations[lang][key]) {
                        el.innerHTML = translations[lang][key];
                    }
                });
                document.title = translations[lang].page_title;
                document.querySelector('meta[name="description"]').setAttribute('content', translations[lang].meta_desc);
                const toggleBtn = document.getElementById('langToggle');
                if (toggleBtn) toggleBtn.querySelector('span').textContent = translations[lang].lang_toggle;
                renderWhyFeatures();
                localStorage.setItem('royal-stay-lang', lang);
            }

            function renderWhyFeatures() {
                const grid = document.getElementById('whyGrid');
                if (!grid) return;
                let html = '';
                const texts = featureTexts[currentLang];
                featuresData.forEach((f, index) => {
                    const t = texts[f.key];
                    html += `<article class="feature-card" data-aos="fade-up" data-aos-delay="${(index + 1) * 50}">
                        <div class="feature-icon"><i class="fas ${f.icon}"></i></div>
                        <h3>${t.title}</h3>
                        <p>${t.desc}</p>
                    </article>`;
                });
                grid.innerHTML = html;
            }

            document.addEventListener('DOMContentLoaded', () => {
                const savedLang = localStorage.getItem('royal-stay-lang');
                const lang = savedLang || detectLanguage();
                setLanguage(lang);

                document.getElementById('langToggle').addEventListener('click', () => {
                    const newLang = currentLang === 'ar' ? 'en' : 'ar';
                    setLanguage(newLang);
                });

                AOS.init({ duration: 900, once: true });

                document.getElementById('menuBtn').addEventListener('click', () => {
                    document.getElementById('navLinks').classList.toggle('open');
                });
                document.querySelectorAll('.nav-links a').forEach(a => {
                    a.addEventListener('click', () => document.getElementById('navLinks').classList.remove('open'));
                });
            });
        })();
    </script>
</body>
</html>
