<!DOCTYPE html>

<head>

    <style>
        :root {
            --deep: #060B14; --text: #F8FAFC; --muted: #94A3B8;
            --gold: #C9A050; --gold-light: #E0BC6B;
            --gold-soft: rgba(201, 160, 80, 0.15);
            --transition: 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior:smooth; }
        body {
            font-family: 'Cairo', sans-serif; background: var(--deep);
            color: var(--text); overflow-x: hidden; line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }
        a { color:inherit; text-decoration:none; }
        img { display:block; max-width:100%; }
        .container { width: min(1280px, 92%); margin-inline: auto; }

        /* NAVBAR */
        .navbar {
            position: fixed; top:0; left:0; right:0; z-index:1000;
            padding: 0.7rem 0; transition: all var(--transition);
            background: rgba(6,11,20,0.85); backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .nav-inner {
            display: flex; justify-content: space-between;
            align-items: center; gap: 15px;
        }
        .brand {
            display: flex; flex-direction: row; align-items: center;
            gap: 10px; text-align: start; min-width: max-content;
        }
        .brand img {
            width: 40px; height: 40px; border-radius: 14px; background: #fff;
            border: 2px solid var(--gold); box-shadow: 0 8px 20px rgba(201,160,80,0.2);
            flex-shrink: 0;
        }
        .brand .name { display: flex; flex-direction: column; line-height: 1.2; }
        .brand .name strong {
            font-family: 'Playfair Display', serif; font-size: 1rem; color: #fff;
        }
        .brand .name span { font-size: 0.6rem; color: var(--muted); }

        .nav-links { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
        .nav-links a {
            padding:0.5rem 0.9rem; border-radius:100px; font-weight:700;
            font-size:0.8rem; transition:all var(--transition); color:#E2E8F0;
        }
        .nav-links a:hover, .nav-links a.active {
            background:rgba(255,255,255,0.08); color:#fff;
        }
        .nav-cta {
            background: linear-gradient(135deg, #B28A30, #D4A843);
            color: #fff !important; text-shadow: 0 1px 2px rgba(0,0,0,0.3);
            box-shadow: 0 8px 20px -5px rgba(201,160,80,0.6); font-weight: 800;
        }
        .nav-cta:hover { background: linear-gradient(135deg, #D4A843, #E0BC6B); }

        .nav-actions { display: flex; align-items: center; gap: 8px; }
        .lang-btn {
            padding:0.5rem 0.9rem; border-radius:100px; font-weight:700;
            font-size:0.8rem; transition:all var(--transition); cursor:pointer;
            background: rgba(201,160,80,0.08); border: 1px solid var(--gold);
            color: var(--gold-light); font-family: inherit;
            display: inline-flex; align-items: center; gap: 0.3rem;
        }
        .lang-btn:hover { background: var(--gold); color: #0A0F1E; border-color: var(--gold); }
        .menu-btn {
            display: none; width:38px; height:38px; border-radius:12px;
            background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);
            color:#fff; font-size:1.2rem; cursor:pointer;
        }

        /* PAGE HEADER */
        .page-header { padding: 7rem 0 2rem; text-align: center; }
        .page-header .eyebrow {
            display:inline-flex; align-items:center; gap:0.6rem;
            background:var(--gold-soft); border:1px solid rgba(201,160,80,0.25);
            padding:0.4rem 1.4rem; border-radius:100px;
            font-size:0.75rem; font-weight:800; letter-spacing:0.1em;
            text-transform:uppercase; color:var(--gold-light); margin-bottom:1.2rem;
        }
        .page-header h1 {
            font-family:'Playfair Display',serif;
            font-size: clamp(2.2rem, 5vw, 3.5rem); font-weight:800;
        }
        .page-header h1 .gold { color:var(--gold-light); }

        /* CONTACT CTA */
        .contact-cta {
            background:linear-gradient(135deg, #0A1128, #0d1f3c);
            border-radius:2rem; padding:2.5rem 2rem; text-align:center;
            box-shadow:0 20px 40px -10px rgba(0,0,0,0.5);
            position:relative; overflow:hidden; max-width:650px; margin:0 auto 4rem;
        }
        .contact-cta::before {
            content:''; position:absolute; top:-40%; right:-20%;
            width:250px; height:250px; background:rgba(201,160,80,0.08);
            border-radius:50%; pointer-events:none;
        }
        .contact-cta h2 {
            font-family:'Playfair Display',serif; font-size:1.8rem;
            margin-bottom:0.8rem; color:#fff; position:relative; z-index:1;
        }
        .contact-cta p {
            color:#b8c8d8; font-size:0.95rem; margin-bottom:1.5rem;
            position:relative; z-index:1;
        }
        .phone-cards {
            display:flex; flex-wrap:wrap; gap:1rem; justify-content:center;
            position:relative; z-index:1;
        }
        .phone-card {
            background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1);
            border-radius:1.5rem; padding:1rem 1.5rem; backdrop-filter:blur(10px);
            display:flex; align-items:center; gap:0.8rem; min-width:200px;
        }
        .phone-number {
            font-family:'Playfair Display',serif; font-size:1.4rem;
            direction:ltr; color:var(--gold-light);
        }
        .phone-actions { display:flex; gap:0.6rem; }
        .call-icon-link, .wa-icon-link {
            width:38px; height:38px; border-radius:14px; display:grid;
            place-items:center; color:#fff;
        }
        .call-icon-link { background:#0EA5E9; }
        .wa-icon-link { background:#25D366; }

        /* شريط التواصل الأفقي في الأسفل */
        .social-bottom {
            padding: 2rem 0;
            background: rgba(255,255,255,0.02);
            border-top: 1px solid rgba(255,255,255,0.05);
            text-align: center;
        }
        .social-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            justify-content: center;
            align-items: center;
        }
        .social-icon-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(201,160,80,0.3);
            color: var(--gold-light);
            font-size: 1.4rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
        }
        .social-icon-circle:hover {
            background: var(--gold);
            color: #0A0F1E;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(201,160,80,0.3);
        }

        footer { padding:3rem 0; border-top:1px solid rgba(255,255,255,0.06); text-align:center; color:var(--muted); }

        @media (max-width: 768px) {
            .menu-btn { display: flex; place-items: center; }
            .nav-links {
                position: fixed; top: 65px; left: 1rem; right: 1rem;
                background: rgba(6,11,20,0.95); backdrop-filter: blur(20px);
                border-radius: 2rem; padding: 1.5rem; flex-direction: column;
                display: none; box-shadow: 0 30px 50px rgba(0,0,0,0.5);
                order: 3;
            }
            .nav-links.open { display: flex; }
            .brand { order: 0; }
            .nav-actions { order: 1; }
            .phone-cards { flex-direction:column; align-items:center; }
            .social-bottom { padding: 1.5rem 0; }
            .social-icon-circle { width: 44px; height: 44px; font-size: 1.2rem; }
        }
    </style>
</head>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        (function() {
            const translations = {
                ar: {
                    page_title: "تواصل مع Royal Stay | احجز الآن",
                    meta_desc: "تواصل مع فريق Royal Stay لحجز شاليهك الفاخر في مراسي وهاسيندا باي. خدمة 24/7 واتساب واتصال فوري.",
                    brand_tagline: "شاليهات فاخرة • مراسي",
                    nav_home: "الرئيسية", nav_why: "لماذا نحن", nav_chalets: "الشاليهات", nav_contact: "تواصل معنا",
                    page_eyebrow: "تواصل معنا",
                    page_title_h1: 'احجز <span class="gold">دلوقتي</span> أو استفسر',
                    cta_title: "✨ مستعد تعيش تجربة الفخامة في مراسي؟",
                    cta_desc: "احجز شاليهك الآن واستمتع بإقامة أحلامك.",
                    footer_text: '© 2025 <span style="color:var(--gold-light);">Royal Stay</span> - جميع الحقوق محفوظة',
                    lang_toggle: "English"
                },
                en: {
                    page_title: "Contact Royal Stay | Book Now",
                    meta_desc: "Contact the Royal Stay team to book your luxury chalet in Marassi and Hacienda Bay. 24/7 WhatsApp and direct call.",
                    brand_tagline: "Luxury Chalets • Marassi",
                    nav_home: "Home", nav_why: "Why Us", nav_chalets: "Chalets", nav_contact: "Contact",
                    page_eyebrow: "Contact Us",
                    page_title_h1: 'Book <span class="gold">Now</span> or Inquire',
                    cta_title: "✨ Ready to Experience Luxury in Marassi?",
                    cta_desc: "Book your chalet now and enjoy your dream stay.",
                    footer_text: '© 2025 <span style="color:var(--gold-light);">Royal Stay</span> - All Rights Reserved',
                    lang_toggle: "عربي"
                }
            };

            let currentLang = 'ar';
            const htmlEl = document.documentElement;

            function detectLanguage() {
                const browserLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
                return browserLang.startsWith('ar') ? 'ar' : 'en';
            }

            function setLanguage(lang) {
                currentLang = lang;
                htmlEl.lang = lang;
                htmlEl.dir = lang === 'ar' ? 'rtl' : 'ltr';
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    if (translations[lang] && translations[lang][key]) {
                        el.innerHTML = translations[lang][key];
                    }
                });
                document.title = translations[lang].page_title;
                document.querySelector('meta[name="description"]').setAttribute('content', translations[lang].meta_desc);
                const toggleBtn = document.getElementById('langToggle');
                if (toggleBtn) toggleBtn.querySelector('span').textContent = translations[lang].lang_toggle;
                localStorage.setItem('royal-stay-lang', lang);
            }

            document.addEventListener('DOMContentLoaded', () => {
                const savedLang = localStorage.getItem('royal-stay-lang');
                const lang = savedLang || detectLanguage();
                setLanguage(lang);

                document.getElementById('langToggle').addEventListener('click', () => {
                    const newLang = currentLang === 'ar' ? 'en' : 'ar';
                    setLanguage(newLang);
                });

                AOS.init({ duration: 900, once: true });

                document.getElementById('menuBtn').addEventListener('click', () => {
                    document.getElementById('navLinks').classList.toggle('open');
                });
                document.querySelectorAll('.nav-links a').forEach(a => {
                    a.addEventListener('click', () => document.getElementById('navLinks').classList.remove('open'));
                });
            });
        })();
    </script>
